name: ci

# master, the release branches and the release tags - the tag run is the record that the tagged tree
# itself is green. Feature branches are covered by their pull request; workflow_dispatch re-runs any ref.
on:
  push:
    branches: [master, "release/**"]
    tags: ["*"]
  pull_request:
  workflow_dispatch:

# One run per ref: a newer push to the same pull request cancels the older run. master, release
# branches and tags are never cancelled, so every commit that lands there keeps its own result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The default GITHUB_TOKEN is read-write. Nothing here writes to the repository - these jobs only
# read the tree, lint and test it and upload the coverage report - so they run with the least
# privilege that still lets actions/checkout fetch the code.
permissions:
  contents: read

jobs:
  lint:
    name: pre-commit (markdown + hygiene)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # actions/checkout runs `git init`, which prints a multi-line "default branch name" hint on
      # every job; naming the default up front is what silences it. master is this repository's
      # default branch anyway.
      - name: Name git's default branch
        run: git config --global init.defaultBranch master

      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install pre-commit
        run: pip install pre-commit

      # markdownlint-cli2 runs with `fix: true`, so an unformatted file shows up as a diff here
      # instead of being silently rewritten on somebody's laptop.
      - name: Run the language-agnostic hooks
        run: pre-commit run --all-files --show-diff-on-failure

  build:
    name: build + test (JDK ${{ matrix.java-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # 11 is the bytecode floor the pom compiles against, 21 the JDK the compiler
        # image itself ships - the jar has to build on both.
        java-version: ["11", "21"]
    steps:
      # actions/checkout runs `git init`, which prints a multi-line "default branch name" hint on
      # every job; naming the default up front is what silences it. master is this repository's
      # default branch anyway.
      - name: Name git's default branch
        run: git config --global init.defaultBranch master

      # The stubs are committed, so compiling them needs no submodule. ondewo-sip-api is checked
      # out (and only it - not ondewo-proto-compiler) because GeneratedServicesTest compares the
      # committed stubs with the `service` / `rpc` lines of its protos.
      - uses: actions/checkout@v7

      - name: Check out the ondewo-sip-api submodule (the protos the stubs are generated from)
        run: git submodule update --init ondewo-sip-api

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}
          cache: maven

      # A hard gate, not a guard: an empty scaffold must turn this job RED, because every
      # step after it would otherwise pass vacuously. The floor is 2, not the pilot's 100:
      # this api is the single proto ondewo/sip/sip.proto, from which protoc emits exactly
      # one outer class plus one *Grpc class. GeneratedServicesTest compares the stubs with the
      # protos service by service - this step only catches an empty or half-committed tree.
      - name: Assert the generated client is committed
        run: |
          set -euo pipefail
          test -f pom.xml || { echo "::error::pom.xml is missing - it is hand-maintained, restore it with 'git checkout pom.xml'"; exit 1; }
          test -d src/main/java || { echo "::error::src/main/java is missing - run 'make build' and commit the result"; exit 1; }
          stubs=$(find src/main/java -name '*.java' | wc -l)
          services=$(find src/main/java -name '*Grpc.java' | wc -l)
          echo "committed stubs: $stubs java files, $services gRPC service classes"
          test "$stubs" -ge 2 || { echo "::error::only $stubs generated java files, expected at least 2 - the client looks truncated"; exit 1; }
          test "$services" -gt 0 || { echo "::error::no *Grpc.java service stubs found"; exit 1; }

      # `verify` = compile the stubs, run the JUnit 5 suite against them, write the jacoco
      # report and enforce the 100% coverage rule on the hand-written sources - the same command
      # as `make test`. The jars it builds on the way (so a javadoc break fails here too) never
      # leave the runner.
      - name: Build, test and check coverage
        run: mvn -B --no-transfer-progress verify

      # jacoco:check SKIPS itself when no execution data was written, so a build in which the
      # agent never attached would pass the gate vacuously. This step closes that hole: after
      # a green `verify` the report must exist and must actually list a class.
      - name: Coverage summary (hand-written sources)
        run: |
          set -euo pipefail
          report=target/site/jacoco/jacoco.csv
          test -f "$report" || { echo "::error::no jacoco report at $report - the coverage gate did not run"; exit 1; }
          test "$(tail -n +2 "$report" | wc -l)" -gt 0 || { echo "::error::the jacoco report is empty - no hand-written class was measured"; exit 1; }
          {
            echo "### JaCoCo - hand-written sources (JDK ${{ matrix.java-version }})"
            echo ""
            echo "| class | instructions | branches | lines | methods |"
            echo "| --- | --- | --- | --- | --- |"
            awk -F, 'NR > 1 {
              printf "| %s.%s | %d/%d | %d/%d | %d/%d | %d/%d |\n", $2, $3,
                     $5, $4 + $5, $7, $6 + $7, $9, $8 + $9, $13, $12 + $13
            }' "$report"
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$report"

      # Reporting only - `if: always()` so a failed run still yields the HTML report to look at.
      - name: Upload the coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-jdk${{ matrix.java-version }}
          path: target/site/jacoco/
          if-no-files-found: warn
