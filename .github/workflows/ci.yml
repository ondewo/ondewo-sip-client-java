name: ci

on:
  push:
    branches: ["**"]
  pull_request:

# This workflow builds and tests the COMMITTED stubs. It deliberately does NOT build the
# ondewo-java-proto-compiler image and does NOT run the generator: that needs both submodules
# and a docker build, is minutes slow, and is a separate integration concern owned by
# `make build`. Nothing here is conditional - a missing or broken client fails the run instead
# of skipping a step and reporting green.

jobs:
  lint:
    name: pre-commit (markdown + hygiene)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install pre-commit
        run: pip install pre-commit

      # markdownlint-cli2 runs with `fix: true`, so an unformatted file shows up as a diff here
      # instead of being silently rewritten on somebody's laptop.
      - name: Run the language-agnostic hooks
        run: pre-commit run --all-files --show-diff-on-failure

  build:
    name: build + test (JDK ${{ matrix.java-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 11 is the bytecode floor the generated pom compiles against, 21 the JDK the compiler
        # image itself ships - the jar has to build on both.
        java-version: ["11", "21"]
    steps:
      # No `submodules:` - the stubs are committed, so neither ondewo-sip-api nor
      # ondewo-proto-compiler is needed to compile and test them.
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}
          cache: maven

      # A hard gate, not a guard: an empty scaffold must turn this job RED, because every
      # step after it would otherwise pass vacuously. The floor is 2, not the pilot's 100:
      # this api is the single proto ondewo/sip/sip.proto, from which protoc emits exactly
      # one outer class plus one *Grpc class. EXPECTED_SERVICE_COUNT in GeneratedServicesTest
      # carries the real precision - this step only catches an empty or half-committed tree.
      - name: Assert the generated client is committed
        run: |
          set -euo pipefail
          test -f pom.xml || { echo "::error::pom.xml is missing - run 'make build' and commit the result"; exit 1; }
          test -d src/main/java || { echo "::error::src/main/java is missing - run 'make build' and commit the result"; exit 1; }
          stubs=$(find src/main/java -name '*.java' | wc -l)
          services=$(find src/main/java -name '*Grpc.java' | wc -l)
          echo "committed stubs: $stubs java files, $services gRPC service classes"
          test "$stubs" -ge 2 || { echo "::error::only $stubs generated java files, expected at least 2 - the client looks truncated"; exit 1; }
          test "$services" -gt 0 || { echo "::error::no *Grpc.java service stubs found"; exit 1; }

      # `verify` = compile the stubs, run the JUnit 5 suite against them, write the jacoco
      # report and enforce the 100% coverage rule on the hand-written sources. It also builds
      # the jar and the sources jar, so a packaging regression fails here too.
      - name: Build, test and check coverage
        run: mvn -B --no-transfer-progress verify

      # jacoco:check SKIPS itself when no execution data was written, so a build in which the
      # agent never attached would pass the gate vacuously. This step closes that hole: after
      # a green `verify` the report must exist and must actually list a class.
      - name: Coverage summary (hand-written sources)
        run: |
          set -euo pipefail
          report=target/site/jacoco/jacoco.csv
          test -f "$report" || { echo "::error::no jacoco report at $report - the coverage gate did not run"; exit 1; }
          test "$(tail -n +2 "$report" | wc -l)" -gt 0 || { echo "::error::the jacoco report is empty - no hand-written class was measured"; exit 1; }
          {
            echo "### JaCoCo - hand-written sources (JDK ${{ matrix.java-version }})"
            echo ""
            echo "| class | instructions | branches | lines | methods |"
            echo "| --- | --- | --- | --- | --- |"
            awk -F, 'NR > 1 {
              printf "| %s.%s | %d/%d | %d/%d | %d/%d | %d/%d |\n", $2, $3,
                     $5, $4 + $5, $7, $6 + $7, $9, $8 + $9, $13, $12 + $13
            }' "$report"
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$report"

      # Reporting only - `if: always()` so a failed run still yields the HTML report to look at.
      - name: Upload the coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-jdk${{ matrix.java-version }}
          path: target/site/jacoco/
          if-no-files-found: warn

  publish-dry-run:
    name: maven central dry run
    runs-on: ubuntu-latest
    # The packaging path a RELEASE takes, exercised on every push with no credential at all.
    # `make dry_run_maven_central` builds with the `release` profile, signs every artifact with
    # a throwaway key it generates on the spot, and verifies the signatures - so a pom that
    # Maven Central would reject, a javadoc jar that stopped building or a broken signing
    # configuration turns THIS job red, months before somebody cuts a release.
    # It can never publish: the central-publishing goal is bound to `deploy`, and this stops
    # at `verify`.
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Rehearse the Maven Central deployment
        run: make dry_run_maven_central

      - name: List the deployment bundle
        run: |
          set -euo pipefail
          {
            echo "### Maven Central deployment bundle (dry run)"
            echo ""
            echo "| file | bytes |"
            echo "| --- | --- |"
            find target -maxdepth 1 -type f \( -name '*.jar' -o -name '*.asc' \) \
              -exec ls -l {} \; | awk '{ printf "| %s | %s |\n", $NF, $5 }' | sort
          } >> "$GITHUB_STEP_SUMMARY"
